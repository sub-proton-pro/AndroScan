[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "androscan"
version = "0.1.0"
description = "LLM-native Android pentesting tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.26",
]
# Lane-1 RAG indexer over decompiled sources (Phase 6 step 3).
# Default embedder is `fastembed` (small ONNX models, no GPU required).
# `numpy` accelerates brute-force cosine top-k; pure-Python fallback is used when
# numpy is missing. `sqlite-vec` is reserved for a future drop-in vector index
# upgrade and is intentionally not pinned here yet.
rag = [
    "fastembed>=0.3",
    "numpy>=1.26",
]
# Hook Lab dynamic instrumentation (Phase 6 step 4 / DEC-023).
# `frida` + `frida-tools` are the host-side Python bindings; the device-side
# frida-server is operator-managed (see docs/SAFETY_AND_SECURITY.md). The
# adapter (androscan/adapters/frida_client.py) lazy-imports `frida` so this
# extra is only required when running Hook Lab features.
# `pyjsparser` is reserved for sub-step 4.5's Inject-button JS pre-validation
# and is pinned here so 4.5 doesn't need to touch first-run setup.
frida = [
    "frida>=16",
    "frida-tools>=12",
    "pyjsparser>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["androscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "device: marks tests requiring a connected emulator/device (deselect with '-m \"not device\"')",
]
