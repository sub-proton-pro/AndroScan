[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "androscan"
version = "0.1.0"
description = "LLM-native Android pentesting tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.26",
]
# Lane-1 RAG indexer over decompiled sources (Phase 6 step 3).
# Default embedder is `fastembed` (small ONNX models, no GPU required).
# `numpy` accelerates brute-force cosine top-k; pure-Python fallback is used when
# numpy is missing. `sqlite-vec` is reserved for a future drop-in vector index
# upgrade and is intentionally not pinned here yet.
rag = [
    "fastembed>=0.3",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["androscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
