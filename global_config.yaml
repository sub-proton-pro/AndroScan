# AndroScan global config. Optional; env vars override these values.
# Pass path via --config or place at repo root / config/global_config.yaml

ollama:
  base_url: "http://localhost:11434"
  timeout_sec: 150
  model: "qwen3.5:35b"
  temperature: 0.2
  # Phase 11 sub-step 11.6 / DEC-025 — bumped from 8192 to absorb the
  # v2 inter-procedural slicer's ~1.5x response payload growth.
  num_predict: 12288
  # Phase 11 sub-step 11.6 / DEC-025 — Ollama's default context window
  # is 8192 tokens; v2's ~2x input prompt growth (deeper PredicateOrigin
  # chains in the per-anchor closure) can squeeze it. 16384 preserves
  # headroom; live-reloadable.
  num_ctx: 16384

# LCP.4 / DEC-027 — llama.cpp ``llama-server`` local LLM provider.
# Activate by setting ``llm.provider`` (or the ``ANDROSCAN_LLM_PROVIDER``
# env var) to ``"llamacpp"``. Operator must run ``llama-server`` on the
# configured port (default 8033 — chosen to avoid the upstream default
# 8080 collision class). Recommended startup line:
#   llama-server -c 16384 -ngl 99 -fa --port 8033 \
#                --host 127.0.0.1 --jinja -m <path-to-gguf>
# - ``base_url`` includes the OpenAI-compat ``/v1`` suffix.
# - ``model``     is a free-text label (llama-server ignores the
#                  request-body ``model`` field; the actual GGUF is
#                  loaded at server startup). Useful for log readability.
# - ``max_tokens`` is the OpenAI-compat ``/v1/chat/completions`` cap.
#                  Mirrors the role of ``ollama.num_predict`` for the
#                  llama.cpp dispatch path. Bump this above 8192 if
#                  your server-side ``--ctx-size`` budget allows.
llamacpp:
  base_url: "http://127.0.0.1:8033/v1"
  model: ""
  max_tokens: 8192

# LCP.6 / DEC-027 — local-LLM grammar / JSON-schema enforcement.
# Closes ISSUE-016 (JSON-validity drift on aggressive quants like Q4_K_M
# / IQ4_XS). When ``true`` (default), AndroScan sends:
#   * Ollama  → ``format: <json-schema>``  (requires Ollama >= 0.5.0)
#   * llama.cpp → ``grammar: <gbnf>`` on /v1/chat/completions
# Cloud providers ignore this knob (their OpenAI-compat ``response_format``
# already enforces validity at the SDK layer).
# The LLM client also auto-falls-back per base_url on the first 400
# response that mentions schema / grammar, so old runtimes keep working
# without operator action; flipping false here is the kill-switch for
# cases the auto-fallback can't recover from.
# llm:
#   local_grammar_enabled: true

paths:
  run_folder_root: "apps"
  apktool_cmd: "apktool"
  jadx_cmd: "jadx"

workflow:
  max_turns: 5
  max_hypotheses_per_report: 10
  per_component_analysis: true

output:
  section_rule_char: "─"
  section_rule_length: 60

# Local RE Workbench (Phase 6): bind loopback by default; see docs/SAFETY_AND_SECURITY.md
web:
  host: "127.0.0.1"
  port: 8420
  screencap_interval_ms: 500

# Lane-1 RAG over decompiled sources (Phase 6 step 3).
# Provider can be: fastembed (default, local ONNX) | ollama (re-uses base_url above)
# Model: leave empty for the provider's recommended default
#   fastembed -> BAAI/bge-small-en-v1.5
#   ollama    -> nomic-embed-text  (run: ollama pull nomic-embed-text)
rag:
  embed_provider: "fastembed"
  embed_model: ""
  top_k_default: 8

# Hook Lab dynamic instrumentation (Phase 6 step 4 / DEC-023).
# trace_ring_buffer_size caps the in-memory live-trace buffer per Frida session.
# Persistent traces will land at apps/<app_id>/<run_ts>/frida/<session>.jsonl
# (sub-step 4.5). Min clamp = 100 events.
frida:
  trace_ring_buffer_size: 5000

# Behavior Trace v1 — Lab tab gate-identification + bypass-planning mode (Phase 10 / DEC-024).
# bypass_risk_max: maximum risk level the planner will emit into the default
# bypass-plan list. One of "low" | "medium" | "high"; plans whose risk exceeds
# this threshold are surfaced behind an "Advanced" expander in the UI rather
# than mixed with the defaults. Invalid values fail-soft to "medium".
# max_hops_default: closure depth used by trace_behavior when the operator
# (or a calling skill) doesn't supply an explicit hops arg. Higher values
# expand the gate pool but cost LLM tokens + per-method static analysis.
# max_hops_hard_cap: absolute ceiling on closure depth — even an explicit
# hops arg is clamped to this value. Bounds the worst-case per-anchor cost.
# max_slice_depth: Phase 11 sub-step 11.6 / DEC-025 — bounded inter-
# procedural slicer descent depth. Per-decision; the v2 slicer descends
# past method-call / field-read terminals up to this many hops. Hard
# cap of 4 enforced in slicing._DescentBudget.fresh() regardless of
# the YAML value. Live-reloadable.
trace:
  bypass_risk_max: "medium"
  max_hops_default: 3
  max_hops_hard_cap: 6
  max_slice_depth: 2
